# Tell Spring Boot to look inside backend/.env first, then current folder
spring.config.import=optional:file:backend/.env[.properties],optional:file:.env[.properties]

# Database Configuration (TiDB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Explicit dialect prevents metadata lookup crashes
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY}